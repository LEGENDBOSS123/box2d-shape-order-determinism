<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Box2D Order Desync</title>
<style>
:root{--bg:#14161a;--panel:#1d2026;--fg:#e6e8eb;--mut:#8b929c;--bad:#ff4d4f;--ok:#3ecf8e;--line:#2b3038}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
header h1{font-size:14px;margin:0 8px 0 0}
select,button,input{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--mut)}
#grid{flex:1;display:grid;grid-template:1fr 1fr/1fr 1fr;gap:6px;padding:6px;min-height:0}
.cell{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:0}
.cell canvas{width:100%;height:100%;display:block}
.label{position:absolute;left:8px;top:6px;font-size:12px;pointer-events:none;text-shadow:0 1px 2px #000}
.label b{display:block;font-size:13px}.label span{color:var(--mut)}
.stat{position:absolute;right:8px;top:6px;text-align:right;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000;pointer-events:none}
.bad{color:var(--bad)}.ok{color:var(--ok)}
</style></head><body>
<header>
  <h1>Box2D insertion-order desync</h1>
  <label>Scene <select id="scene"></select></label>
  <label>Shuffle seed <input id="seed" type="number" value="1234" style="width:80px"></label>
  <label>Speed <select id="speed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select>×</label>
  <button id="reset">Reset</button><button id="pause">Pause</button>
  <span id="frame" style="color:var(--mut)"></span>
</header>
<div id="grid">
  <div class="cell"><canvas id="c0"></canvas><div class="label"><b>Original box2d · order A</b><span>reference</span></div><div class="stat" id="s0"></div></div>
  <div class="cell"><canvas id="c1"></canvas><div class="label"><b>Original box2d · order B (shuffled)</b><span>same shapes, added in different order</span></div><div class="stat" id="s1"></div></div>
  <div class="cell"><canvas id="c2"></canvas><div class="label"><b>Patched box2d · order A</b><span>reference</span></div><div class="stat" id="s2"></div></div>
  <div class="cell"><canvas id="c3"></canvas><div class="label"><b>Patched box2d · order B (shuffled)</b><span>same shapes, added in different order</span></div><div class="stat" id="s3"></div></div>
</div>
<script type="module" src="./main.js"></script>
</body></html>
